<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>아이디어 PD 제로</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { color-scheme: light; }
    body { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .shell { height: 100vh; height: 100dvh; }
    .composer { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .message { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (min-width: 640px) {
      .shell { height: min(880px, calc(100dvh - 3rem)); }
    }
  </style>
</head>
<body class="m-0 flex min-h-dvh justify-center bg-[#e9edf5] text-slate-900 sm:items-center sm:p-6">
  <main class="shell flex w-full max-w-2xl flex-col overflow-hidden bg-white sm:rounded-[2rem] sm:shadow-xl sm:shadow-slate-900/10">
    <header class="shrink-0 bg-[#141c32] px-5 py-5 text-white sm:px-7">
      <div class="flex items-center gap-3">
        <div aria-hidden="true" class="grid size-11 shrink-0 place-items-center rounded-2xl bg-[#c9fa84] font-mono text-lg font-black tracking-tighter text-[#141c32]">PD</div>
        <div class="min-w-0 flex-1">
          <h1 class="text-lg font-bold tracking-tight sm:text-xl">아이디어 PD 제로</h1>
          <p class="text-xs text-slate-300 sm:text-sm">게임·콘텐츠 기획 멘토</p>
        </div>
        <button id="reset" type="button" hidden class="shrink-0 rounded-xl border border-slate-500 px-3 py-2 text-xs font-semibold hover:bg-white/10 disabled:opacity-50">새 대화</button>
      </div>
    </header>

    <section aria-label="API 설정" class="shrink-0 border-b border-slate-200 px-5 py-4 sm:px-7">
      <label for="api-key" class="mb-2 block text-sm font-bold">선생님께 받은 열쇠(API KEY)</label>
      <form id="key-form" class="flex gap-2">
        <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required
          aria-describedby="key-notice" placeholder="실습용 API 키 입력"
          class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-base outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200 disabled:opacity-65">
        <button id="key-button" type="submit" class="shrink-0 rounded-xl bg-indigo-700 px-3 py-2 text-sm font-bold text-white hover:bg-indigo-800 disabled:opacity-50 sm:px-4">대화 열기</button>
      </form>
      <p id="key-notice" class="mt-2 text-xs leading-relaxed text-slate-600">선생님께 받은 수업 실습용 임시 키만 사용하세요. 완성한 앱을 인터넷에 공개 배포하지 마세요.</p>
    </section>

    <section id="chat-panel" aria-label="대화" tabindex="0" class="min-h-0 grow overflow-y-auto bg-[#f3f5fa] px-5 py-5 outline-offset-[-3px] sm:px-7">
      <div id="locked" class="grid h-full min-h-24 place-content-center text-center">
        <p class="text-base font-bold text-slate-800">아이디어를 기획서로</p>
        <p class="mt-1 text-sm text-slate-600">위에 API 키를 입력하면 대화를 열 수 있어요.</p>
      </div>
      <div id="messages" role="log" aria-label="메시지" aria-live="polite" class="flex flex-col gap-4"></div>
      <p id="activity" role="status" class="text-sm font-medium text-indigo-800"></p>
    </section>

    <footer class="composer shrink-0 border-t border-slate-200 bg-white px-5 pt-3 sm:px-7">
      <p id="error" role="alert" hidden class="mb-2 rounded-xl bg-red-50 px-3 py-2 text-sm text-red-800"></p>
      <form id="chat-form" class="flex items-end gap-2">
        <textarea id="message" rows="2" disabled aria-label="보낼 메시지" placeholder="어떤 아이디어를 만들고 싶나요?"
          class="min-w-0 flex-1 resize-none rounded-2xl border border-slate-300 bg-slate-50 px-3 py-2 text-base leading-5 outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-200 disabled:opacity-60"></textarea>
        <button id="send" type="submit" disabled class="min-h-11 shrink-0 rounded-2xl bg-[#c9fa84] px-4 py-2 text-sm font-extrabold text-[#141c32] hover:bg-lime-300 disabled:opacity-45">보내기</button>
      </form>
    </footer>
  </main>
  <script>
    const GEMINI_MODEL = 'gemini-3.5-flash-lite';
    const GEMINI_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models';

    // 마스터 프롬프트 전체를 Gemini의 시스템 지침으로 보냅니다.
    const SYSTEM_INSTRUCTION = [
      "# [System Prompt] 게임·콘텐츠 기획 멘토 '아이디어 PD 제로' 마스터 프롬프트",
      "",
      "---",
      "",
      "### **1. 페르소나 정체성 및 역할**",
      "- **이름**: **아이디어 PD 제로**",
      "- **정체성**: 당신은 고등학생이 게임, 웹툰, 숏폼 영상, 유튜브 콘텐츠, 캐릭터 세계관, 앱 아이디어를 구체적인 기획서로 발전시킬 수 있도록 돕는 **AI 창작 멘토**입니다. 학생의 짧고 엉뚱한 아이디어도 절대 무시하지 않고 재미 포인트를 찾아내며, 수업 시간 안에 만들 수 있는 현실적인 결과물로 바꿔줍니다. 창작의 핵심은 거창한 아이디어가 아니라 **'작게 완성하는 힘'**이라고 믿습니다.",
      "- **주요 대상**: 게임, 웹툰, 애니메이션, 유튜브, 숏폼 영상에 관심이 있거나, 코딩은 잘 모르지만 AI로 게임이나 앱을 만들고 싶어 하는 고등학생입니다.",
      "- **핵심 역할**:",
      "  - 학생의 아이디어를 게임 또는 콘텐츠 기획서로 정리합니다.",
      "  - 게임 아이디어를 캐릭터, 목표, 규칙, 아이템, 장애물, 점수 시스템으로 발전시킵니다.",
      "  - 웹툰이나 영상 아이디어를 세계관, 등장인물, 갈등 구조, 첫 장면으로 구성합니다.",
      "  - 바이브코딩에 사용할 **HTML 게임 제작 프롬프트**를 생성합니다.",
      "  - 발표용 기획 요약을 작성합니다.",
      "",
      "---",
      "",
      "### **2. 말투 및 대화 톤앤매너**",
      "- **기본 말투**: 항상 정중하고 친근한 **존댓말**을 사용합니다.",
      "- **대화 스타일**: 밝고 에너지 있는 **창작 PD**처럼 말합니다.",
      "- **주요 표현**: “이 아이디어 좋습니다. 이제 게임 규칙으로 바꿔봅시다.”, “핵심 재미 포인트는 이것입니다.”와 같은 긍정적이고 주도적인 표현을 활용합니다.",
      "- **태도**: 학생의 아이디어를 절대 평가절하하지 않고 동기부여를 제공합니다.",
      "",
      "---",
      "",
      "### **3. 대화 방식 및 진행 절차**",
      "1. **첫 입력 정보 파악**: 학생에게 **만들고 싶은 것, 주제, 분위기, 주인공, 사용자가 하게 될 행동, 가장 재미있었으면 하는 장면, 제작 기간(수업 시간 내 완성 vs 장기 프로젝트)**을 확인합니다.",
      "2. **대화 진행 단계**:",
      "   1) 학생의 아이디어를 한 문장으로 요약합니다.",
      "   2) 핵심 재미 포인트를 도출합니다.",
      "   3) 만들 수 있는 결과물 형태를 추천합니다.",
      "   4) 구체적인 기획서로 정리합니다.",
      "   5) 지나치게 큰 아이디어는 수업용 미니 버전으로 축소해 줍니다.",
      "   6) AI 제작용 프롬프트를 작성합니다.",
      "   7) 발표용 소개 문장을 완성합니다.",
      "",
      "---",
      "",
      "### **4. 응답 구조 및 기획서 출력 형식**",
      "응답 작성 시 아래의 **기본 응답 형식** 순서를 엄격히 준수합니다.",
      "",
      "```markdown",
      "[아이디어 한 줄 요약]",
      "[제목 추천 3개]",
      "[핵심 재미 포인트]",
      "[기획서]",
      "[AI 제작 프롬프트]",
      "[발표용 소개문]",
      "```",
      "",
      "- **게임 기획서 작성 시 포함 항목**: 게임 제목, 한 줄 소개, 장르, 플레이어 캐릭터, 목표, 조작 방법, 장애물, 아이템, 점수 시스템, 레벨 구조, 승리 조건, 게임오버 조건, 추가 재미 요소, HTML 게임 제작 프롬프트.",
      "- **콘텐츠 기획서 작성 시 포함 항목**: 콘텐츠 제목, 핵심 콘셉트, 주인공, 배경 세계관, 갈등 또는 문제, 첫 장면, 재미 포인트, 시청자가 궁금해할 요소, 후속 에피소드 아이디어, 발표용 요약.",
      "",
      "---",
      "",
      "### **5. 금지 사항 (Negative Constraints)**",
      "- 저작권이 있는 유명 캐릭터를 그대로 사용하라고 하지 않습니다.",
      "- 폭력, 혐오, 차별적인 내용을 권장하거나 포함하지 않습니다.",
      "- 고등학생 수준에서 구현할 수 없는 지나치게 복잡한 기능을 요구하지 않습니다.",
      "- 코딩 초보에게 어려운 전문 게임 엔진이나 라이브러리를 강요하지 않습니다.",
      "",
      "---",
      "",
      "### **6. 첫 인사 메시지 (First Message)**",
      "> **“안녕하세요. 저는 아이디어 PD 제로입니다. 짧은 아이디어도 괜찮습니다. 게임, 웹툰, 영상, 앱 중 무엇을 만들고 싶은지 말해주시면 바로 기획서와 제작 프롬프트로 바꿔드리겠습니다.”**"
    ].join('\n');

    const FIRST_MESSAGE = '안녕하세요. 저는 아이디어 PD 제로입니다. 짧은 아이디어도 괜찮습니다. 게임, 웹툰, 영상, 앱 중 무엇을 만들고 싶은지 말해주시면 바로 기획서와 제작 프롬프트로 바꿔드리겠습니다.';
    const keyForm = document.querySelector('#key-form');
    const keyInput = document.querySelector('#api-key');
    const keyButton = document.querySelector('#key-button');
    const resetButton = document.querySelector('#reset');
    const chatPanel = document.querySelector('#chat-panel');
    const locked = document.querySelector('#locked');
    const messages = document.querySelector('#messages');
    const activity = document.querySelector('#activity');
    const chatForm = document.querySelector('#chat-form');
    const draft = document.querySelector('#message');
    const sendButton = document.querySelector('#send');
    const errorBox = document.querySelector('#error');

    // 키와 대화는 현재 페이지의 메모리에만 둡니다.
    let apiKey = '';
    let pending = false;
    const history = [];

    function updateControls() {
      draft.disabled = !apiKey || pending;
      sendButton.disabled = draft.disabled || !draft.value.trim();
      keyInput.disabled = Boolean(apiKey);
      keyInput.hidden = Boolean(apiKey);
      keyButton.type = apiKey ? 'button' : 'submit';
      keyButton.textContent = apiKey ? 'API 키 변경' : '대화 열기';
      keyButton.disabled = pending;
      resetButton.hidden = !apiKey;
      resetButton.disabled = pending;
      locked.hidden = Boolean(apiKey);
      activity.textContent = pending ? '아이디어 PD 제로가 답변을 작성하고 있어요…' : '';
      activity.classList.toggle('mt-4', pending);
    }

    function showError(message = '') {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }

    function addMessage(role, text) {
      const isUser = role === 'user';
      const row = document.createElement('div');
      row.className = isUser ? 'self-end max-w-[94%]' : 'self-start max-w-[96%]';
      const name = document.createElement('p');
      name.className = 'mb-1 px-1 text-xs font-bold text-slate-600';
      name.textContent = isUser ? '나' : '아이디어 PD 제로';
      if (isUser) name.classList.add('text-right');
      const bubble = document.createElement('p');
      bubble.className = 'message whitespace-pre-wrap rounded-2xl px-4 py-3 text-sm leading-relaxed ' +
        (isUser ? 'rounded-tr-sm bg-indigo-700 text-white' : 'rounded-tl-sm border border-slate-200 bg-white');
      bubble.textContent = text;
      row.append(name, bubble);
      messages.append(row);
      return row;
    }

    function resetConversation() {
      history.length = 0;
      messages.replaceChildren();
      draft.value = '';
      showError();
      addMessage('model', FIRST_MESSAGE);
      updateControls();
      chatPanel.scrollTop = 0;
      draft.focus();
    }

    keyForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (apiKey || pending) return;
      const value = keyInput.value.trim();
      if (!value) {
        showError('선생님께 받은 API 키를 입력해 주세요.');
        return;
      }
      apiKey = value;
      keyInput.value = '';
      if (messages.childElementCount === 0) resetConversation();
      updateControls();
      draft.focus();
    });

    keyButton.addEventListener('click', () => {
      if (!apiKey || pending) return;
      apiKey = '';
      history.length = 0;
      messages.replaceChildren();
      draft.value = '';
      showError();
      updateControls();
      keyInput.focus();
    });

    resetButton.addEventListener('click', resetConversation);
    draft.addEventListener('input', updateControls);
    draft.addEventListener('keydown', (event) => {
      // 한글을 조합하는 동안 누른 Enter는 전송으로 처리하지 않습니다.
      if (event.key !== 'Enter' || event.shiftKey || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (!sendButton.disabled) chatForm.requestSubmit();
    });

    function apiError(status, reason) {
      if (status === 401 || status === 403 || reason === 'API_KEY_INVALID') {
        return 'API 키가 유효한지, Gemini API를 사용할 권한이 있는지 확인해 주세요.';
      }
      if (status === 404) return '현재 API 키에서 ' + GEMINI_MODEL + ' 모델을 사용할 수 있는지 확인해 주세요.';
      if (status === 429) return '요청 한도에 도달했어요. 사용량을 확인하거나 잠시 후 다시 시도해 주세요.';
      if (status >= 500) return 'Gemini 서비스에서 오류가 발생했어요. 잠시 후 다시 시도해 주세요.';
      return 'Gemini 요청을 처리하지 못했어요. API 키와 모델 설정을 확인해 주세요. (HTTP ' + status + ')';
    }

    async function askGemini(contents) {
      const endpoint = GEMINI_ENDPOINT + '/' + encodeURIComponent(GEMINI_MODEL) + ':generateContent';
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents
        }),
        signal: AbortSignal.timeout(60000)
      });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const reason = data?.error?.details?.find((detail) => detail.reason)?.reason;
        throw new Error(apiError(response.status, reason));
      }
      const candidate = data?.candidates?.[0];
      const answer = candidate?.content?.parts
        ?.filter((part) => !part.thought && typeof part.text === 'string')
        .map((part) => part.text).join('').trim();
      if (!answer) {
        throw new Error('표시할 답변이 없어요. 아이디어를 조금 더 구체적으로 적어 다시 보내 주세요.');
      }
      // 응답 원본을 기록해 다음 요청에서도 모델의 이전 답변과 메타데이터를 전달합니다.
      return { answer, modelTurn: { role: 'model', parts: candidate.content.parts } };
    }

    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = draft.value.trim();
      if (!apiKey || !message || pending) return;
      const userTurn = { role: 'user', parts: [{ text: message }] };
      const userRow = addMessage('user', message);
      draft.value = '';
      showError();
      pending = true;
      updateControls();
      chatPanel.scrollTop = chatPanel.scrollHeight;

      try {
        const { answer, modelTurn } = await askGemini([...history, userTurn]);
        history.push(userTurn, modelTurn);
        const reply = addMessage('model', answer);
        chatPanel.scrollTop = reply.offsetTop - messages.offsetTop;
      } catch (error) {
        userRow.remove();
        draft.value = message;
        if (error.name === 'TimeoutError') {
          showError('답변을 기다리는 시간이 초과됐어요. 다시 보내 주세요.');
        } else if (error instanceof TypeError) {
          showError('Gemini에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 보내 주세요.');
        } else {
          showError(error.message);
        }
      } finally {
        pending = false;
        updateControls();
      }
    });

    updateControls();
  </script>
</body>
</html>
